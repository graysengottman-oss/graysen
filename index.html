<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graysen | Portfolio</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}
html{
    scroll-behavior:smooth;
}
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3eee4;
    color:#111;
    line-height:1.6;
}
button,
input,
textarea{
    font:inherit;
}
button{
    cursor:pointer;
}
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(243,238,228,.94);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #d8d0c2;
}
.nav{
    max-width:1150px;
    margin:auto;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}
.logo{
    font-size:25px;
    font-weight:700;
    letter-spacing:-1px;
}
nav{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}
nav button{
    border:0;
    background:transparent;
    padding:9px 13px;
    border-radius:8px;
    color:#111;
}
nav button:hover,
nav button.active{
    background:#dfe7dc;
}
.container{
    max-width:1150px;
    margin:auto;
    padding:50px 24px 80px;
}
.page{
    display:none;
    animation:fade .3s ease;
}
.page.active{
    display:block;
}
@keyframes fade{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
.hero{
    min-height:65vh;
    display:grid;
    grid-template-columns:1fr 330px;
    align-items:center;
    gap:60px;
}
.hero h1{
    font-size:clamp(55px,9vw,105px);
    line-height:.9;
    letter-spacing:-6px;
    margin-bottom:25px;
}
.hero p{
    max-width:650px;
    font-size:19px;
    color:#555;
}
.profile{
    width:100%;
    aspect-ratio:1;
    border-radius:20px;
    object-fit:cover;
    background:#ddd5c8;
}
.no-profile{
    width:100%;
    aspect-ratio:1;
    border-radius:20px;
    background:#ded7ca;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    text-align:center;
    padding:30px;
}
.section-title{
    margin-bottom:35px;
}
.section-title h2{
    font-size:45px;
    letter-spacing:-2px;
}
.section-title p{
    color:#666;
    margin-top:5px;
}
.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}
.photo-card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}
.photo-card img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    display:block;
    cursor:pointer;
}
.caption{
    padding:13px 15px;
    color:#444;
}
.empty{
    padding:50px 20px;
    border:1px dashed #aaa;
    border-radius:15px;
    text-align:center;
    color:#777;
}
.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}
.card{
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 18px rgba(0,0,0,.05);
}
.card h3{
    font-size:24px;
    margin-bottom:8px;
}
.card p{
    color:#666;
    margin-bottom:18px;
}
.link{
    color:#315c38;
    font-weight:700;
    text-decoration:none;
}
.button{
    border:0;
    background:#315c38;
    color:white;
    padding:12px 18px;
    border-radius:9px;
    font-weight:700;
}
.button:hover{
    opacity:.9;
}
.outline{
    background:transparent;
    color:#315c38;
    border:1px solid #315c38;
}
.editor-button{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:2000;
    border:0;
    border-radius:50px;
    padding:14px 20px;
    background:#111;
    color:#fff;
    box-shadow:0 8px 30px rgba(0,0,0,.2);
}
.modal{
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.modal.show{
    display:flex;
}
.modal-box{
    width:min(800px,100%);
    max-height:90vh;
    overflow:auto;
    background:#f8f5ef;
    border-radius:18px;
    padding:25px;
}
.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:25px;
}
.close{
    border:0;
    background:transparent;
    font-size:28px;
}
.field{
    margin-bottom:20px;
}
.field label{
    display:block;
    font-weight:700;
    margin-bottom:7px;
}
.field input,
.field textarea{
    width:100%;
    border:1px solid #ccc3b5;
    border-radius:9px;
    padding:12px;
    background:#fff;
}
.field textarea{
    min-height:110px;
    resize:vertical;
}
.editor-section{
    border-top:1px solid #d8d0c2;
    margin-top:25px;
    padding-top:25px;
}
.editor-photo{
    display:grid;
    grid-template-columns:90px 1fr auto;
    gap:12px;
    align-items:center;
    background:#fff;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}
.editor-photo img{
    width:90px;
    height:70px;
    object-fit:cover;
    border-radius:7px;
}
.remove{
    border:0;
    background:#b53a32;
    color:#fff;
    padding:8px 10px;
    border-radius:7px;
}
.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:25px;
}
.status{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
}
.status.show{
    display:block;
}
.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:4000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px;
}
.lightbox.show{
    display:flex;
}
.lightbox img{
    max-width:95%;
    max-height:90%;
    object-fit:contain;
}
.lightbox button{
    position:absolute;
    top:20px;
    right:25px;
    background:transparent;
    border:0;
    color:#fff;
    font-size:35px;
}
@media(max-width:750px){
    .nav{
        align-items:flex-start;
        flex-direction:column;
    }
    nav{
        width:100%;
        overflow-x:auto;
    }
    .hero{
        grid-template-columns:1fr;
        gap:35px;
    }
    .hero h1{
        font-size:65px;
    }
    .profile,
    .no-profile{
        max-width:330px;
    }
    .gallery{
        grid-template-columns:repeat(2,1fr);
    }
    .cards{
        grid-template-columns:1fr;
    }
}
@media(max-width:500px){
    .container{
        padding:35px 16px 70px;
    }
    .gallery{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>
<header>
    <div class="nav">
        <div class="logo" id="logo">Graysen</div>
        <nav>
            <button onclick="showPage('home')" id="nav-home">Home</button>
            <button onclick="showPage('photography')" id="nav-photography">Photography</button>
            <button onclick="showPage('research')" id="nav-research">Political Research</button>
            <button onclick="showPage('newspaper')" id="nav-newspaper">Newspaper</button>
        </nav>
    </div>
</header>
<main class="container">
    <!-- HOME -->
    <section id="home" class="page active">
        <div class="hero">
            <div>
                <h1 id="homeName">Graysen</h1>
                <p id="homeBio"></p>
            </div>
            <div id="profileContainer"></div>
        </div>
    </section>
    <!-- PHOTOGRAPHY -->
    <section id="photography" class="page">
        <div class="section-title">
            <h2>Photography</h2>
            <p>A collection of my photography.</p>
        </div>
        <div id="gallery" class="gallery"></div>
    </section>
    <!-- RESEARCH -->
    <section id="research" class="page">
        <div class="section-title">
            <h2>Political Research</h2>
            <p>Research, writing, and projects.</p>
        </div>
        <div id="researchCards" class="cards"></div>
    </section>
    <!-- NEWSPAPER -->
    <section id="newspaper" class="page">
        <div class="section-title">
            <h2 id="newspaperTitle">Newspaper</h2>
            <p id="newspaperDescription"></p>
        </div>
        <div id="newspaperLink"></div>
    </section>
</main>
<button class="editor-button" onclick="openEditor()">
    Edit Portfolio
</button>
<!-- PASSWORD MODAL -->
<div class="modal" id="passwordModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>Editor Access</h2>
            <button class="close" onclick="closeModal('passwordModal')">×</button>
        </div>
        <div class="field">
            <label>Editor Code</label>
            <input id="editorCodeInput" type="password" placeholder="Enter code">
        </div>
        <div class="actions">
            <button class="button" onclick="checkCode()">Continue</button>
        </div>
        <div id="passwordStatus" class="status"></div>
    </div>
</div>
<!-- EDITOR -->
<div class="modal" id="editorModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>Edit Portfolio</h2>
            <button class="close" onclick="closeModal('editorModal')">×</button>
        </div>
        <div class="field">
            <label>Name</label>
            <input id="editName">
        </div>
        <div class="field">
            <label>Bio</label>
            <textarea id="editBio"></textarea>
        </div>
        <div class="field">
            <label>Profile Photo</label>
            <input type="file" id="profileUpload" accept="image/*">
        </div>
        <div class="editor-section">
            <h3>Photography</h3>
            <p style="color:#666;margin:5px 0 15px;">
                Maximum 25 photos. Photos are automatically compressed.
            </p>
            <input
                type="file"
                id="photoUpload"
                accept="image/*"
                multiple
            >
            <div id="editorPhotos" style="margin-top:15px;"></div>
        </div>
        <div class="editor-section">
            <h3>Political Research</h3>
            <div id="editorResearch"></div>
            <button class="button outline" onclick="addResearch()">
                + Add Research
            </button>
        </div>
        <div class="editor-section">
            <h3>Newspaper</h3>
            <div class="field">
                <label>Title</label>
                <input id="editNewspaperTitle">
            </div>
            <div class="field">
                <label>Description</label>
                <textarea id="editNewspaperDescription"></textarea>
            </div>
            <div class="field">
                <label>Link</label>
                <input id="editNewspaperLink" placeholder="https://...">
            </div>
        </div>
        <div class="actions">
            <button class="button" onclick="publishPortfolio()">
                Save & Publish
            </button>
            <button class="button outline" onclick="closeModal('editorModal')">
                Cancel
            </button>
        </div>
        <div id="publishStatus" class="status"></div>
    </div>
</div>
<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <button onclick="closeLightbox()">×</button>
    <img id="lightboxImage">
</div>
<script>
/* =========================================================
   SETTINGS
========================================================= */
const GITHUB_OWNER = "graysengottman-oss";
const GITHUB_REPOSITORY = "graysen";
const GITHUB_BRANCH = "main";
const DATA_FILE = "portfolio-data.json";
const EDITOR_CODE = "4547";
const MAX_PHOTOS = 25;
/* =========================================================
   DEFAULT DATA
========================================================= */
let portfolio = {
    name: "Graysen",
    bio: "Welcome to my portfolio. This is where I share my photography, political research, and newspaper work.",
    profileImage: "",
    photos: [],
    research: [],
    newspaper: {
        title: "Newspaper",
        description: "Articles, projects, and work from the newspaper.",
        link: ""
    }
};
/* =========================================================
   LOAD DATA
========================================================= */
async function loadPortfolio(){
    try{
        const response = await fetch(
            DATA_FILE + "?v=" + Date.now()
        );
        if(response.ok){
            const data = await response.json();
            portfolio = {
                ...portfolio,
                ...data,
                newspaper:{
                    ...portfolio.newspaper,
                    ...(data.newspaper || {})
                }
            };
        }
    }catch(error){
        console.log("Using default portfolio data.");
    }
    renderPortfolio();
}
/* =========================================================
   RENDER
========================================================= */
function renderPortfolio(){
    document.getElementById("logo").textContent =
        portfolio.name || "Graysen";
    document.getElementById("homeName").textContent =
        portfolio.name || "Graysen";
    document.getElementById("homeBio").textContent =
        portfolio.bio || "";
    const profileContainer =
        document.getElementById("profileContainer");
    if(portfolio.profileImage){
        profileContainer.innerHTML = `
            <img
                class="profile"
                src="${escapeAttribute(portfolio.profileImage)}"
                alt="Profile photo"
            >
        `;
    }else{
        profileContainer.innerHTML = `
            <div class="no-profile">
                Add a profile photo from Edit Portfolio.
            </div>
        `;
    }
    renderPhotos();
    renderResearch();
    renderNewspaper();
}
/* =========================================================
   PAGES
========================================================= */
function showPage(page){
    document.querySelectorAll(".page").forEach(section => {
        section.classList.remove("active");
    });
    document.getElementById(page).classList.add("active");
    document.querySelectorAll("nav button").forEach(button => {
        button.classList.remove("active");
    });
    const navButton =
        document.getElementById("nav-" + page);
    if(navButton){
        navButton.classList.add("active");
    }
    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}
/* =========================================================
   PHOTOS
========================================================= */
function renderPhotos(){
    const gallery =
        document.getElementById("gallery");
    gallery.innerHTML = "";
    if(!portfolio.photos ||
       portfolio.photos.length === 0){
        gallery.innerHTML = `
            <div class="empty">
                No photos yet.
            </div>
        `;
        return;
    }
    portfolio.photos.forEach((photo,index)=>{
        const card =
            document.createElement("div");
        card.className = "photo-card";
        card.innerHTML = `
            <img
                src="${escapeAttribute(photo.url)}"
                alt="${escapeAttribute(photo.caption || "Photography")}"
                onclick="openLightbox('${escapeAttribute(photo.url)}')"
            >
            ${
                photo.caption
                ?
                `<div class="caption">
                    ${escapeHTML(photo.caption)}
                </div>`
                :
                ""
            }
        `;
        gallery.appendChild(card);
    });
}
/* =========================================================
   RESEARCH
========================================================= */
function renderResearch(){
    const container =
        document.getElementById("researchCards");
    container.innerHTML = "";
    if(!portfolio.research ||
       portfolio.research.length === 0){
        container.innerHTML = `
            <div class="empty">
                No research projects yet.
            </div>
        `;
        return;
    }
    portfolio.research.forEach(item=>{
        const card =
            document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <h3>
                ${escapeHTML(item.title || "Untitled")}
            </h3>
            <p>
                ${escapeHTML(item.description || "")}
            </p>
            ${
                item.link
                ?
                `<a
                    class="link"
                    href="${escapeAttribute(item.link)}"
                    target="_blank"
                    rel="noopener"
                >
                    View Research →
                </a>`
                :
                ""
            }
        `;
        container.appendChild(card);
    });
}
/* =========================================================
   NEWSPAPER
========================================================= */
function renderNewspaper(){
    const newspaper =
        portfolio.newspaper || {};
    document.getElementById(
        "newspaperTitle"
    ).textContent =
        newspaper.title || "Newspaper";
    document.getElementById(
        "newspaperDescription"
    ).textContent =
        newspaper.description || "";
    const linkContainer =
        document.getElementById("newspaperLink");
    if(newspaper.link){
        linkContainer.innerHTML = `
            <a
                class="button"
                href="${escapeAttribute(newspaper.link)}"
                target="_blank"
                rel="noopener"
            >
                Read Newspaper →
            </a>
        `;
    }else{
        linkContainer.innerHTML = "";
    }
}
/* =========================================================
   EDITOR
========================================================= */
function openEditor(){
    document.getElementById(
        "editorCodeInput"
    ).value = "";
    document.getElementById(
        "passwordStatus"
    ).className = "status";
    document.getElementById(
        "passwordModal"
    ).classList.add("show");
}
function checkCode(){
    const code =
        document.getElementById(
            "editorCodeInput"
        ).value;
    if(code === EDITOR_CODE){
        closeModal("passwordModal");
        openEditorPanel();
    }else{
        showStatus(
            "passwordStatus",
            "Incorrect editor code.",
            true
        );
    }
}
function openEditorPanel(){
    document.getElementById("editName").value =
        portfolio.name || "";
    document.getElementById("editBio").value =
        portfolio.bio || "";
    document.getElementById(
        "editNewspaperTitle"
    ).value =
        portfolio.newspaper?.title || "";
    document.getElementById(
        "editNewspaperDescription"
    ).value =
        portfolio.newspaper?.description || "";
    document.getElementById(
        "editNewspaperLink"
    ).value =
        portfolio.newspaper?.link || "";
    renderEditorPhotos();
    renderEditorResearch();
    document.getElementById(
        "editorModal"
    ).classList.add("show");
}
function closeModal(id){
    document.getElementById(id)
        .classList.remove("show");
}
/* =========================================================
   PROFILE IMAGE
========================================================= */
document.getElementById(
    "profileUpload"
).addEventListener(
    "change",
    async function(){
        const file = this.files[0];
        if(!file) return;
        try{
            showStatus(
                "publishStatus",
                "Compressing profile photo..."
            );
            const compressed =
                await compressImage(file);
            portfolio.profileImage =
                await fileToDataURL(compressed);
            renderEditorPhotos();
            showStatus(
                "publishStatus",
                "Profile photo ready."
            );
        }catch(error){
            showStatus(
                "publishStatus",
                error.message,
                true
            );
        }
    }
);
/* =========================================================
   PHOTO UPLOAD
========================================================= */
document.getElementById(
    "photoUpload"
).addEventListener(
    "change",
    async function(){
        const files =
            Array.from(this.files || []);
        if(!files.length) return;
        if(
            portfolio.photos.length + files.length
            > MAX_PHOTOS
        ){
            showStatus(
                "publishStatus",
                "You can have a maximum of 25 photos.",
                true
            );
            return;
        }
        try{
            showStatus(
                "publishStatus",
                "Compressing photos..."
            );
            for(const file of files){
                const compressed =
                    await compressImage(file);
                const dataURL =
                    await fileToDataURL(compressed);
                portfolio.photos.push({
                    url:dataURL,
                    caption:""
                });
            }
            renderEditorPhotos();
            showStatus(
                "publishStatus",
                "Photos added."
            );
        }catch(error){
            showStatus(
                "publishStatus",
                error.message,
                true
            );
        }
        this.value = "";
    }
);
/* =========================================================
   EDITOR PHOTOS
========================================================= */
function renderEditorPhotos(){
    const container =
        document.getElementById(
            "editorPhotos"
        );
    container.innerHTML = "";
    portfolio.photos.forEach(
        (photo,index)=>{
            const row =
                document.createElement("div");
            row.className =
                "editor-photo";
            row.innerHTML = `
                <img
                    src="${escapeAttribute(photo.url)}"
                    alt=""
                >
                <input
                    type="text"
                    placeholder="Photo caption"
                    value="${escapeAttribute(photo.caption || "")}"
                    onchange="updateCaption(${index}, this.value)"
                >
                <button
                    class="remove"
                    onclick="removePhoto(${index})"
                >
                    Remove
                </button>
            `;
            container.appendChild(row);
        }
    );
}
function updateCaption(index,value){
    portfolio.photos[index].caption =
        value;
}
function removePhoto(index){
    portfolio.photos.splice(index,1);
    renderEditorPhotos();
}
/* =========================================================
   RESEARCH EDITOR
========================================================= */
function renderEditorResearch(){
    const container =
        document.getElementById(
            "editorResearch"
        );
    container.innerHTML = "";
    portfolio.research.forEach(
        (item,index)=>{
            const box =
                document.createElement("div");
            box.className = "card";
            box.style.marginBottom = "15px";
            box.innerHTML = `
                <div class="field">
                    <label>Title</label>
                    <input
                        value="${escapeAttribute(item.title || "")}"
                        onchange="portfolio.research[${index}].title=this.value"
                    >
                </div>
                <div class="field">
                    <label>Description</label>
                    <textarea
                        onchange="portfolio.research[${index}].description=this.value"
                    >${escapeHTML(item.description || "")}</textarea>
                </div>
                <div class="field">
                    <label>Link</label>
                    <input
                        value="${escapeAttribute(item.link || "")}"
                        placeholder="https://..."
                        onchange="portfolio.research[${index}].link=this.value"
                    >
                </div>
                <button
                    class="remove"
                    onclick="removeResearch(${index})"
                >
                    Remove Research
                </button>
            `;
            container.appendChild(box);
        }
    );
}
function addResearch(){
    portfolio.research.push({
        title:"",
        description:"",
        link:""
    });
    renderEditorResearch();
}
function removeResearch(index){
    portfolio.research.splice(index,1);
    renderEditorResearch();
}
/* =========================================================
   GITHUB PUBLISHING
========================================================= */
async function publishPortfolio(){
    const status =
        document.getElementById(
            "publishStatus"
        );
    try{
        portfolio.name =
            document.getElementById(
                "editName"
            ).value.trim() || "Graysen";
        portfolio.bio =
            document.getElementById(
                "editBio"
            ).value.trim();
        portfolio.newspaper = {
            title:
                document.getElementById(
                    "editNewspaperTitle"
                ).value.trim(),
            description:
                document.getElementById(
                    "editNewspaperDescription"
                ).value.trim(),
            link:
                document.getElementById(
                    "editNewspaperLink"
                ).value.trim()
        };
        const token =
            prompt(
                "Paste your GitHub Personal Access Token here.\n\nYour token is only used for this publish and is not saved by this website."
            );
        if(!token){
            throw new Error(
                "GitHub token was not entered."
            );
        }
        showStatus(
            "publishStatus",
            "Publishing to GitHub..."
        );
        /*
         * First upload profile image if it is a new
         * data URL.
         */
        if(
            portfolio.profileImage &&
            portfolio.profileImage.startsWith("data:")
        ){
            showStatus(
                "publishStatus",
                "Uploading profile photo..."
            );
            const profileBlob =
                dataURLToBlob(
                    portfolio.profileImage
                );
            const profilePath =
                "images/profile-" +
                Date.now() +
                ".jpg";
            const profileURL =
                await uploadBinaryFile(
                    token,
                    profilePath,
                    profileBlob,
                    "Update profile photo"
                );
            portfolio.profileImage =
                profileURL;
        }
        /*
         * Upload new photography.
         */
        for(
            let i=0;
            i<portfolio.photos.length;
            i++
        ){
            const photo =
                portfolio.photos[i];
            if(
                photo.url &&
                photo.url.startsWith("data:")
            ){
                showStatus(
                    "publishStatus",
                    `Uploading photo ${i+1} of ${portfolio.photos.length}...`
                );
                const blob =
                    dataURLToBlob(
                        photo.url
                    );
                const path =
                    "images/photo-" +
                    Date.now() +
                    "-" +
                    i +
                    ".jpg";
                const publicURL =
                    await uploadBinaryFile(
                        token,
                        path,
                        blob,
                        "Add photography"
                    );
                photo.url =
                    publicURL;
            }
        }
        showStatus(
            "publishStatus",
            "Updating portfolio data..."
        );
        await updateDataFile(
            token,
            portfolio
        );
        renderPortfolio();
        showStatus(
            "publishStatus",
            "✓ Published successfully! GitHub Pages may take a few minutes to update."
        );
    }catch(error){
        console.error(error);
        showStatus(
            "publishStatus",
            "Error: " + error.message,
            true
        );
    }
}
/* =========================================================
   GITHUB API — DATA FILE
========================================================= */
async function updateDataFile(token,data){
    const apiURL =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPOSITORY}/contents/${DATA_FILE}`;
    let sha = null;
    const existing =
        await fetch(
            apiURL +
            "?ref=" +
            encodeURIComponent(GITHUB_BRANCH),
            {
                headers:{
                    Authorization:"Bearer " + token,
                    Accept:"application/vnd.github+json"
                }
            }
        );
    if(existing.ok){
        const existingJSON =
            await existing.json();
        sha =
            existingJSON.sha;
    }else if(existing.status !== 404){
        const text =
            await existing.text();
        throw new Error(
            "Could not access portfolio-data.json: " +
            text
        );
    }
    const json =
        JSON.stringify(
            data,
            null,
            2
        );
    const body = {
        message:
            "Update portfolio data",
        content:
            utf8ToBase64(json),
        branch:
            GITHUB_BRANCH
    };
    if(sha){
        body.sha = sha;
    }
    const response =
        await fetch(
            apiURL,
            {
                method:"PUT",
                headers:{
                    Authorization:"Bearer " + token,
                    Accept:"application/vnd.github+json",
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(body)
            }
        );
    if(!response.ok){
        const errorText =
            await response.text();
        throw new Error(
            "GitHub data update failed: " +
            errorText
        );
    }
}
/* =========================================================
   GITHUB API — IMAGE FILE
========================================================= */
async function uploadBinaryFile(
    token,
    path,
    blob,
    message
){
    const apiURL =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPOSITORY}/contents/${path}`;
    const buffer =
        await blob.arrayBuffer();
    const bytes =
        new Uint8Array(buffer);
    const base64 =
        uint8ArrayToBase64(bytes);
    const response =
        await fetch(
            apiURL,
            {
                method:"PUT",
                headers:{
                    Authorization:
                        "Bearer " + token,
                    Accept:
                        "application/vnd.github+json",
                    "Content-Type":
                        "application/json"
                },
                body:JSON.stringify({
                    message:message,
                    content:base64,
                    branch:GITHUB_BRANCH
                })
            }
        );
    if(!response.ok){
        const text =
            await response.text();
        throw new Error(
            "GitHub image upload failed: " +
            text
        );
    }
    const result =
        await response.json();
    /*
     * GitHub Pages URL
     */
    return `https://${GITHUB_OWNER}.github.io/${GITHUB_REPOSITORY}/${path}`;
}
/* =========================================================
   IMAGE COMPRESSION
========================================================= */
async function compressImage(file){
    const bitmap =
        await createImageBitmap(file);
    const maxWidth = 1200;
    let width =
        bitmap.width;
    let height =
        bitmap.height;
    if(width > maxWidth){
        height =
            Math.round(
                height *
                (maxWidth / width)
            );
        width =
            maxWidth;
    }
    const canvas =
        document.createElement("canvas");
    canvas.width =
        width;
    canvas.height =
        height;
    const ctx =
        canvas.getContext("2d");
    ctx.drawImage(
        bitmap,
        0,
        0,
        width,
        height
    );
    let quality = .75;
    let blob =
        await canvasToBlob(
            canvas,
            quality
        );
    /*
     * Keep reducing quality until the image
     * is approximately 800 KB or smaller.
     */
    while(
        blob.size > 800000 &&
        quality > .35
    ){
        quality -= .08;
        blob =
            await canvasToBlob(
                canvas,
                quality
            );
    }
    if(blob.size > 1000000){
        throw new Error(
            "This photo is still too large after compression. Try a smaller photo."
        );
    }
    return blob;
}
function canvasToBlob(canvas,quality){
    return new Promise(
        resolve=>{
            canvas.toBlob(
                blob=>resolve(blob),
                "image/jpeg",
                quality
            );
        }
    );
}
function fileToDataURL(blob){
    return new Promise(
        (resolve,reject)=>{
            const reader =
                new FileReader();
            reader.onload =
                ()=>resolve(
                    reader.result
                );
            reader.onerror =
                reject;
            reader.readAsDataURL(blob);
        }
    );
}
/* =========================================================
   BASE64 HELPERS
========================================================= */
function uint8ArrayToBase64(bytes){
    let binary = "";
    const chunkSize = 0x8000;
    for(
        let i=0;
        i<bytes.length;
        i+=chunkSize
    ){
        binary += String.fromCharCode(
            ...bytes.subarray(
                i,
                Math.min(
                    i+chunkSize,
                    bytes.length
                )
            )
        );
    }
    return btoa(binary);
}
function utf8ToBase64(text){
    const bytes =
        new TextEncoder().encode(text);
    return uint8ArrayToBase64(bytes);
}
function dataURLToBlob(dataURL){
    const parts =
        dataURL.split(",");
    const mime =
        parts[0]
            .match(/:(.*?);/)[1];
    const binary =
        atob(parts[1]);
    const bytes =
        new Uint8Array(
            binary.length
        );
    for(
        let i=0;
        i<binary.length;
        i++
    ){
        bytes[i] =
            binary.charCodeAt(i);
    }
    return new Blob(
        [bytes],
        {type:mime}
    );
}

/* =========================================================
   SECURITY / DISPLAY HELPERS
========================================================= */
function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
function escapeAttribute(value){
    return escapeHTML(value);
}
