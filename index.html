<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graysen | Portfolio</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f3eee4;
    color: #111;
}
header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(243,238,228,.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #d8d0c2;
}
.nav {
    max-width: 1100px;
    margin: auto;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}
.logo {
    font-size: 26px;
    font-weight: bold;
}
nav {
    display: flex;
    gap: 8px;
}
nav button {
    border: 0;
    background: transparent;
    padding: 10px 13px;
    border-radius: 8px;
    cursor: pointer;
}
nav button:hover,
nav button.active {
    background: #dfe7dc;
}
main {
    max-width: 1100px;
    margin: auto;
    padding: 50px 24px 80px;
}
.page {
    display: none;
}
.page.active {
    display: block;
    animation: fade .3s ease;
}
@keyframes fade {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.hero {
    min-height: 70vh;
    display: grid;
    grid-template-columns: 1fr 330px;
    align-items: center;
    gap: 60px;
}
.hero h1 {
    font-size: clamp(60px, 10vw, 105px);
    line-height: .9;
    letter-spacing: -6px;
    margin-bottom: 25px;
}
.hero p {
    max-width: 650px;
    font-size: 19px;
    color: #555;
}
.profile {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 20px;
}
.section-title {
    margin-bottom: 35px;
}
.section-title h2 {
    font-size: 45px;
    letter-spacing: -2px;
}
.section-title p {
    color: #666;
    margin-top: 5px;
}
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}
.photo {
    background: white;
    border-radius: 14px;
    overflow: hidden;
}
.photo img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
}
.caption {
    padding: 12px 14px;
    color: #444;
}
.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}
.card {
    background: white;
    border-radius: 15px;
    padding: 25px;
}
.card h3 {
    margin-bottom: 8px;
    font-size: 24px;
}
.card p {
    color: #666;
}
.empty {
    border: 1px dashed #aaa;
    padding: 45px 20px;
    border-radius: 15px;
    text-align: center;
    color: #777;
}
.link {
    display: inline-block;
    margin-top: 15px;
    color: #315c38;
    font-weight: bold;
    text-decoration: none;
}
@media (max-width: 750px) {
    .nav {
        flex-direction: column;
        align-items: flex-start;
    }
    nav {
        width: 100%;
        overflow-x: auto;
    }
    .hero {
        grid-template-columns: 1fr;
    }
    .profile {
        max-width: 330px;
    }
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
    .cards {
        grid-template-columns: 1fr;
    }
}
@media (max-width: 500px) {
    .gallery {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
<header>
    <div class="nav">
        <div class="logo">Graysen</div>
        <nav>
            <button class="active" onclick="showPage('home')">
                Home
            </button>
            <button onclick="showPage('photography')">
                Photography
            </button>
            <button onclick="showPage('research')">
                Political Research
            </button>
            <button onclick="showPage('newspaper')">
                Newspaper
            </button>
        </nav>
    </div>
</header>
<main>
<section id="home" class="page active">
    <div class="hero">
        <div>
            <h1 id="name">Graysen</h1>
            <p id="bio">
                Welcome to my portfolio. This is where I share my photography,
                political research, and newspaper work.
            </p>
        </div>
        <div id="profile"></div>
    </div>
</section>
<section id="photography" class="page">
    <div class="section-title">
        <h2>Photography</h2>
        <p>A collection of my photography.</p>
    </div>
    <div id="photos" class="gallery"></div>
</section>
<section id="research" class="page">
    <div class="section-title">
        <h2>Political Research</h2>
        <p>Research, writing, and projects.</p>
    </div>
    <div id="researchCards" class="cards"></div>
</section>
<section id="newspaper" class="page">
    <div class="section-title">
        <h2 id="newspaperTitle">Newspaper</h2>
        <p id="newspaperDescription">
            Articles, projects, and work from the newspaper.
        </p>
    </div>
    <div id="newspaperLink"></div>
</section>
</main>
<script>
let portfolio = {
    name: "Graysen",
    bio: "Welcome to my portfolio. This is where I share my photography, political research, and newspaper work.",
    profileImage: "",
    photos: [],
    research: [],
    newspaper: {
        title: "Newspaper",
        description: "Articles, projects, and work from the newspaper.",
        link: ""
    }
};
async function loadPortfolio() {
    try {
        const response = await fetch(
            "portfolio-data.json?v=" + Date.now()
        );
        if (response.ok) {
            const data = await response.json();
            portfolio = {
                ...portfolio,
                ...data
            };
        }
    } catch (error) {
        console.log("Using default portfolio.");
    }
    render();
}
function render() {
    document.getElementById("name").textContent =
        portfolio.name || "Graysen";
    document.getElementById("bio").textContent =
        portfolio.bio || "";
    const profile =
        document.getElementById("profile");
    if (portfolio.profileImage) {
        profile.innerHTML = `
            <img
                class="profile"
                src="${portfolio.profileImage}"
                alt="Graysen"
            >
        `;
    } else {
        profile.innerHTML = `
            <div class="empty">
                Profile photo
            </div>
        `;
    }
    renderPhotos();
    renderResearch();
    renderNewspaper();
}
function renderPhotos() {
    const container =
        document.getElementById("photos");
    container.innerHTML = "";
    if (
        !portfolio.photos ||
        portfolio.photos.length === 0
    ) {
        container.innerHTML = `
            <div class="empty">
                No photography added yet.
            </div>
        `;
        return;
    }
    portfolio.photos.forEach(photo => {
        const div =
            document.createElement("div");
        div.className = "photo";
        div.innerHTML = `
            <img src="${photo.url}" alt="Photography">
            ${
                photo.caption
                ? `<div class="caption">${photo.caption}</div>`
                : ""
            }
        `;
        container.appendChild(div);
    });
}
function renderResearch() {
    const container =
        document.getElementById("researchCards");
    container.innerHTML = "";
    if (
        !portfolio.research ||
        portfolio.research.length === 0
    ) {
        container.innerHTML = `
            <div class="empty">
                No research projects added yet.
            </div>
        `;
        return;
    }
    portfolio.research.forEach(item => {
        const card =
            document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <h3>${item.title || "Untitled"}</h3>
            <p>
                ${item.description || ""}
            </p>
            ${
                item.link
                ? `
                    <a
                        class="link"
                        href="${item.link}"
                        target="_blank"
                    >
                        View Research →
                    </a>
                `
                : ""
            }
        `;
        container.appendChild(card);
    });
}
function renderNewspaper() {
    const newspaper =
        portfolio.newspaper || {};
    document.getElementById(
        "newspaperTitle"
    ).textContent =
        newspaper.title || "Newspaper";
    document.getElementById(
        "newspaperDescription"
    ).textContent =
        newspaper.description || "";
    const link =
        document.getElementById(
            "newspaperLink"
        );
    if (newspaper.link) {
        link.innerHTML = `
            <a
                class="link"
                href="${newspaper.link}"
                target="_blank"
            >
                Read Newspaper →
            </a>
        `;
    } else {
        link.innerHTML = "";
    }
}
function showPage(page) {
    document
        .querySelectorAll(".page")
        .forEach(section => {
            section.classList.remove("active");
        });
    document
        .getElementById(page)
        .classList.add("active");
    document
        .querySelectorAll("nav button")
        .forEach(button => {
            button.classList.remove("active");
        });
    const buttons =
        document.querySelectorAll("nav button");
    const pages = [
        "home",
        "photography",
        "research",
        "newspaper"
    ];
    const index =
        pages.indexOf(page);
    if (index >= 0) {
        buttons[index].classList.add("active");
    }
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
loadPortfolio();
</script>
</body>
</html>
